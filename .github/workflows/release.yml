name: release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/whyslow-db

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install build and security tools
        run: python -m pip install ".[test,security]"

      - name: Require tag to match package version
        run: |
          PACKAGE_VERSION="$(python -c 'from whyslow import __version__; print(__version__)')"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"

      - name: Require green full CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUCCESSFUL_RUNS="$(gh run list --workflow test.yml --commit "$GITHUB_SHA" \
            --status success --json databaseId --jq length)"
          test "$SUCCESSFUL_RUNS" -gt 0

      - name: Build and validate distributions
        run: |
          python -m build --outdir pypi-dist
          python -m twine check pypi-dist/*
          python tests/wheel_install_smoke.py pypi-dist/*.whl

      - name: Audit release dependencies and create SBOM
        run: python tests/release_security_smoke.py pypi-dist/*.whl release-artifacts/

      - name: Create checksums
        run: |
          {
            (cd pypi-dist && sha256sum *.whl *.tar.gz)
            (cd release-artifacts && sha256sum *.cdx.json)
          } > release-artifacts/SHA256SUMS

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: pypi-dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          pypi-dist/*.whl pypi-dist/*.tar.gz release-artifacts/*
          --verify-tag --generate-notes
