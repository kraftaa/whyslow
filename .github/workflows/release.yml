name: release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install ".[test]"

      - name: Require tag to match package version
        run: |
          PACKAGE_VERSION="$(python -c 'from whyslow import __version__; print(__version__)')"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"

      - name: Require green full CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUCCESSFUL_RUNS="$(gh run list --workflow test.yml --commit "$GITHUB_SHA" \
            --status success --json databaseId --jq length)"
          test "$SUCCESSFUL_RUNS" -gt 0

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
          python tests/wheel_install_smoke.py dist/*.whl

      - name: Create checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
