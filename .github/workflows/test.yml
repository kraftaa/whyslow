name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COVERAGE_PROCESS_START: pyproject.toml
      COVERAGE_FILE: .coverage
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          pip install -e ".[test]"
          python -c "import site; from pathlib import Path; Path(site.getsitepackages()[0], 'whyslow_coverage.pth').write_text('import coverage; coverage.process_startup()\n')"

      - name: Create test table
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c \
            "CREATE TABLE orders (id int primary key, val int); INSERT INTO orders VALUES (1, 0);"

      - name: Live Postgres blocking-chain smoke test
        run: python3 tests/live_blocking_smoke.py

      - name: Synthetic REINDEX (3-signal) smoke test
        run: python3 tests/synthetic_reindex_smoke.py

      - name: whyslow diff smoke test
        run: python3 tests/diff_smoke.py

      - name: Puma collector smoke test (single + clustered mode)
        run: python3 tests/puma_smoke.py

      - name: Retention/pruning smoke test
        run: python3 tests/prune_smoke.py

      - name: Timezone regression test
        run: python3 tests/timezone_smoke.py

      - name: Query-label (Rails/ActiveRecord comment) regression test
        run: python3 tests/query_label_smoke.py

      - name: Stored-query privacy regression test
        run: python3 tests/query_privacy_smoke.py

      - name: IO-bound resource-contention regression test
        run: python3 tests/io_contention_smoke.py

      - name: Temporal resource-clustering regression test
        run: python3 tests/temporal_resource_smoke.py

      - name: CloudWatch collector test (mocked via moto)
        run: python3 tests/cloudwatch_smoke.py

      - name: Concurrent read/write smoke test (explain running while a collector writes)
        run: python3 tests/read_write_concurrency_smoke.py

      - name: Online backup and restore-integrity smoke test
        run: python3 tests/backup_smoke.py

      - name: Burst-write concurrency smoke test (severe-incident-scale writes + concurrent reads)
        run: python3 tests/burst_concurrency_smoke.py

      - name: Collector liveness / status smoke test
        run: python3 tests/status_smoke.py

      - name: Deployment doctor smoke test
        run: python3 tests/doctor_smoke.py

      - name: End-to-end CLI test (status, --last windows, diff --baseline-last)
        run: python3 tests/cli_e2e_smoke.py

      - name: Versioned JSON output contract test
        run: python3 tests/json_output_smoke.py

      - name: Event correlation + signal-count regression test
        run: python3 tests/event_smoke.py

      - name: Blocking duration + mid-incident-restart regression test
        run: python3 tests/duration_smoke.py

      - name: Schema migration test (pre-ended_ts database upgrades in place)
        run: python3 tests/migration_smoke.py

      - name: Coverage-gap + live-duration test (unwatched window must never read as all-clear)
        run: python3 tests/coverage_smoke.py

      - name: Collector join/retirement lifecycle test
        run: python3 tests/collector_lifecycle_smoke.py

      - name: Aurora reader-endpoint misconfiguration test
        run: python3 tests/replica_smoke.py

      - name: Scale test (48h window must not OOM or produce unreadable output)
        run: python3 tests/scale_bench.py

      - name: Default-action test (`whyslow --last 15m` routes to explain)
        run: python3 tests/default_action_smoke.py

      - name: CLI and collector input-validation test
        run: python3 tests/input_validation_smoke.py

      - name: Explicit zero-timestamp regression test
        run: python3 tests/timestamp_zero_smoke.py

      - name: Secret configuration test (credentials stay out of process arguments)
        run: python3 tests/secret_config_smoke.py

      - name: Enforce package coverage floor
        run: |
          unset COVERAGE_PROCESS_START
          coverage combine
          coverage report
          coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: whyslow-coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install quality tools
        run: python -m pip install ".[quality]"

      - name: Lint package and tests
        run: ruff check whyslow tests

      - name: Check runtime package formatting
        run: ruff format --check whyslow

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install build and security tools
        run: python -m pip install ".[test,security]"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Install and exercise the wheel outside the source tree
        run: python tests/wheel_install_smoke.py dist/*.whl

      - name: Audit release dependencies and create SBOM
        run: python tests/release_security_smoke.py dist/*.whl dist/

      - name: Upload tested distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: whyslow-distributions
          path: dist/
          if-no-files-found: error
