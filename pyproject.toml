[project]
name = "whyslow-db"
dynamic = ["version"]
description = "PostgreSQL incident reconstruction and reproducible agent-safety experiments."
readme = "README.md"
keywords = [
    "postgresql",
    "database",
    "incident-response",
    "ai-agents",
    "agent-evaluation",
    "ai-safety",
    "least-privilege",
    "reproducibility",
    "abstention",
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["psycopg2-binary>=2.9.12"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/kraftaa/whyslow"
Repository = "https://github.com/kraftaa/whyslow"
Issues = "https://github.com/kraftaa/whyslow/issues"
Documentation = "https://github.com/kraftaa/whyslow#readme"
Benchmarks = "https://github.com/kraftaa/whyslow/blob/main/whyslow/benchmark/README.md"

[project.optional-dependencies]
cloudwatch = ["boto3>=1.43.61"]
test = [
    "boto3>=1.43.61",
    "build>=1.2",
    "coverage==7.15.4",
    "moto[cloudwatch]>=5.2.2",
    "twine>=7.0.0",
]
quality = [
    "ruff==0.15.22",
]
security = [
    "cyclonedx-bom==7.3.0",
    "pip-audit==2.10.1",
]

[project.scripts]
whyslow = "whyslow.cli:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["whyslow*"]

[tool.setuptools.package-data]
"whyslow.benchmark" = ["docker-compose.yml", "scenarios/*/task.md"]

[tool.setuptools.dynamic]
version = {attr = "whyslow.__version__"}

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/migration_smoke.py" = ["E402"]

[tool.coverage.run]
source = ["whyslow"]
parallel = true
omit = ["whyslow/benchmark/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage.xml"
