[project]
name = "whyslow"
version = "0.1.0"
description = "Deterministic, evidence-first CLI that reconstructs why web servers slowed down (Aurora Postgres + Puma + CloudWatch)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["psycopg2-binary>=2.9"]

[project.urls]
Homepage = "https://github.com/kraftaa/whyslow"
Repository = "https://github.com/kraftaa/whyslow"
Issues = "https://github.com/kraftaa/whyslow/issues"

[project.optional-dependencies]
cloudwatch = ["boto3>=1.34"]
test = ["boto3>=1.34", "moto[cloudwatch]>=5.0"]

[project.scripts]
whyslow = "whyslow.cli:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["whyslow*"]
