[project]
name = "whyslow"
dynamic = ["version"]
description = "Deterministic, evidence-first CLI that reconstructs why web servers slowed down (Aurora Postgres + Puma + CloudWatch)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["psycopg2-binary>=2.9.12"]

[project.urls]
Homepage = "https://github.com/kraftaa/whyslow"
Repository = "https://github.com/kraftaa/whyslow"
Issues = "https://github.com/kraftaa/whyslow/issues"

[project.optional-dependencies]
cloudwatch = ["boto3>=1.43.61"]
test = [
    "boto3>=1.43.61",
    "build>=1.2",
    "coverage==7.15.4",
    "moto[cloudwatch]>=5.2.2",
    "twine>=6.0",
]
quality = [
    "ruff==0.15.22",
]
security = [
    "cyclonedx-bom==7.3.0",
    "pip-audit==2.10.1",
]

[project.scripts]
whyslow = "whyslow.cli:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["whyslow*"]

[tool.setuptools.dynamic]
version = {attr = "whyslow.__version__"}

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/migration_smoke.py" = ["E402"]

[tool.coverage.run]
source = ["whyslow"]
parallel = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage.xml"
